version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gradewise-backend
    restart: always
    environment:
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
      - ENVIRONMENT=production
      - CORS_ORIGINS=https://gradewise.netlify.app,http://localhost:5173
    ports:
      - "8000:8000"

  caddy:
    image: caddy:2-alpine
    container_name: gradewise-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
