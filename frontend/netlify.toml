# Netlify Configuration for Dual-Branch Deployment (Staging & Production)

[build]
  command = "node node_modules/vite/bin/vite.js build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production Branch (main) Configuration
[context.production]
  command = "node node_modules/vite/bin/vite.js build"
  environment = { NODE_ENV = "production", VITE_APP_ENV = "production" }

# Staging Branch (dev) Configuration
[context.branch-deploy]
  command = "node node_modules/vite/bin/vite.js build"
  environment = { NODE_ENV = "staging", VITE_APP_ENV = "staging" }

# Deploy Previews for Pull Requests
[context.deploy-preview]
  command = "node node_modules/vite/bin/vite.js build"
